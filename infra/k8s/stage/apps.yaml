apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-auth-service
  namespace: circleguard-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circleguard-auth-service
  template:
    metadata:
      labels:
        app: circleguard-auth-service
    spec:
      containers:
        - name: circleguard-auth-service
          image: circleguard-auth-service:stage
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8180
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://host.docker.internal:5432/circleguard_auth
            - name: SPRING_DATASOURCE_USERNAME
              value: admin
            - name: SPRING_DATASOURCE_PASSWORD
              value: password
            - name: SPRING_LDAP_URLS
              value: ldap://host.docker.internal:389
            - name: SPRING_LDAP_BASE
              value: dc=circleguard,dc=edu
            - name: SPRING_LDAP_USERNAME
              value: cn=admin,dc=circleguard,dc=edu
            - name: SPRING_LDAP_PASSWORD
              value: admin
            - name: JWT_SECRET
              value: my-super-secret-dev-key-32-chars-long-12345678
            - name: QR_SECRET
              value: my-qr-secret-key-for-dev-1234567890
            - name: QR_EXPIRATION
              value: "60000"
            - name: CIRCLEGUARD_IDENTITY_SERVICE_URL
              value: http://circleguard-identity-service:8083/api/v1/identities/map
---
apiVersion: v1
kind: Service
metadata:
  name: circleguard-auth-service
  namespace: circleguard-stage
spec:
  type: NodePort
  selector:
    app: circleguard-auth-service
  ports:
    - name: http
      port: 8180
      targetPort: 8180
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-identity-service
  namespace: circleguard-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circleguard-identity-service
  template:
    metadata:
      labels:
        app: circleguard-identity-service
    spec:
      containers:
        - name: circleguard-identity-service
          image: circleguard-identity-service:stage
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://host.docker.internal:5432/circleguard_identity
            - name: SPRING_DATASOURCE_USERNAME
              value: admin
            - name: SPRING_DATASOURCE_PASSWORD
              value: password
            - name: JWT_SECRET
              value: my-super-secret-dev-key-32-chars-long-12345678
            - name: VAULT_SECRET
              value: 746573742d7365637265742d33322d63686172732d6c6f6e672d313233343536
            - name: VAULT_SALT
              value: deadbeef
            - name: VAULT_HASH_SALT
              value: "12345678"
---
apiVersion: v1
kind: Service
metadata:
  name: circleguard-identity-service
  namespace: circleguard-stage
spec:
  type: NodePort
  selector:
    app: circleguard-identity-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-gateway-service
  namespace: circleguard-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circleguard-gateway-service
  template:
    metadata:
      labels:
        app: circleguard-gateway-service
    spec:
      containers:
        - name: circleguard-gateway-service
          image: circleguard-gateway-service:stage
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
          env:
            - name: SPRING_DATA_REDIS_HOST
              value: circleguard-redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              value: my-super-secret-dev-key-32-chars-long-12345678
            - name: QR_SECRET
              value: my-qr-secret-key-for-dev-1234567890
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-redis
  namespace: circleguard-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circleguard-redis
  template:
    metadata:
      labels:
        app: circleguard-redis
    spec:
      containers:
        - name: redis
          image: redis:7.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: circleguard-redis
  namespace: circleguard-stage
spec:
  type: ClusterIP
  selector:
    app: circleguard-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: circleguard-gateway-service
  namespace: circleguard-stage
spec:
  type: NodePort
  selector:
    app: circleguard-gateway-service
  ports:
    - name: http
      port: 8087
      targetPort: 8087
      nodePort: 30082